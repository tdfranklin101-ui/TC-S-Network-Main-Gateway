<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Profile — TC-S Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#39FF14;--cyan:#00bfff;--purple:#8a2be2;--orange:#ffa500;--gold:#ffd700;--bg:#0a0a0a;--card:#111;--border:#222}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:#e0e0e0;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(57,255,20,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,20,.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#555}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;position:relative;z-index:1}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--cyan);transition:color .2s}
.back-link:hover{color:var(--green);text-decoration:none}
.nav-arrows{display:flex;gap:8px}
.nav-arrows a{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:#aaa;transition:all .2s}
.nav-arrows a:hover{border-color:var(--green);color:var(--green);text-decoration:none}
.container{max-width:900px;margin:0 auto;padding:0 16px 60px;position:relative;z-index:1}
.identity-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.id-icon{font-size:56px;line-height:1}
.id-info{flex:1;min-width:200px}
.id-name{font-family:'Orbitron',sans-serif;font-size:clamp(22px,4vw,32px);font-weight:900;background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.id-code{font-size:13px;color:#888;margin-top:2px}
.id-specialty{font-size:13px;color:var(--purple);margin-top:4px;font-weight:600}
.id-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:12px}
.id-meta span{display:flex;align-items:center;gap:4px}
.id-meta .lbl{color:#666}
.id-meta .val{color:var(--cyan);font-weight:600}
.id-meta .val.gold{color:var(--gold);font-family:'Orbitron',sans-serif}
.id-badge{margin-left:auto;align-self:flex-start}
.status-badge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;background:rgba(57,255,20,.12);color:var(--green);border:1px solid rgba(57,255,20,.3)}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px}
.tab{flex:1;padding:14px;text-align:center;font-size:13px;font-weight:600;color:#666;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;text-transform:uppercase;letter-spacing:1px;user-select:none}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.tab:hover:not(.active){color:var(--cyan)}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-size:13px;color:var(--cyan);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:600;display:flex;align-items:center;gap:8px}
.empty-state{color:#555;font-size:13px;padding:24px;text-align:center;font-style:italic;border:1px dashed #333;border-radius:10px}
.tx-table{width:100%;border-collapse:collapse}
.tx-table th{text-align:left;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px;padding:8px 10px;border-bottom:1px solid var(--border)}
.tx-table td{padding:8px 10px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.03)}
.tx-date-group{font-size:11px;color:var(--cyan);padding:10px 10px 4px;font-weight:600;background:rgba(0,191,255,.04)}
.tx-credit{color:var(--green);font-family:'Orbitron',sans-serif;font-size:11px}
.tx-debit{color:var(--orange);font-family:'Orbitron',sans-serif;font-size:11px}
.tx-bal{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:10px}
.tx-icon{font-size:14px}
.tx-desc{color:#bbb}
.tx-time{color:#555;font-size:10px}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:24px}
.asset-card{background:#0d0d0d;border:1px solid var(--border);border-radius:10px;padding:14px;transition:border-color .2s}
.asset-card:hover{border-color:var(--cyan)}
.asset-title{font-size:13px;font-weight:600;color:#ddd;margin-bottom:6px}
.asset-cat{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--purple);background:rgba(138,43,226,.1);padding:2px 8px;border-radius:10px;margin-bottom:6px}
.asset-price{font-size:12px;color:var(--gold);font-family:'Orbitron',sans-serif}
.asset-meta{font-size:10px;color:#555;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.asset-status{font-size:9px;padding:2px 8px;border-radius:10px}
.asset-status.active{background:rgba(57,255,20,.12);color:var(--green)}
.asset-status.sold{background:rgba(255,165,0,.12);color:var(--orange)}
.ctrl-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.ctrl-section-title{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--green);margin-bottom:4px}
.ctrl-section-sub{font-size:11px;color:#666;margin-bottom:16px}
.slot{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#0d0d0d;flex-wrap:wrap}
.slot-num{font-family:'Orbitron',sans-serif;font-size:12px;color:var(--cyan);min-width:28px;text-align:center;flex-shrink:0}
.slot select{background:#0a0a0a;border:1px solid #333;color:#ccc;padding:7px 10px;border-radius:6px;font-size:12px;font-family:'Space Grotesk',sans-serif;outline:none;min-width:140px;flex-shrink:0}
.slot select:focus{border-color:var(--green);color:var(--green)}
.slot select:disabled{opacity:.6;cursor:not-allowed}
.slot-preview{flex:1;font-size:11px;color:#888;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-btn{background:none;border:1px solid #333;color:#888;font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;transition:all .2s;flex-shrink:0}
.slot-btn:hover{border-color:var(--green);color:var(--green)}
.slot-badge{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.slot-badge.mandatory{background:rgba(255,165,0,.15);color:var(--orange)}
.slot-badge.optional{background:rgba(0,191,255,.1);color:var(--cyan)}
.slot-note{font-size:10px;color:#555;margin-top:4px;padding-left:38px;width:100%}
.slot-lock{font-size:14px;flex-shrink:0}
.slot-price{font-size:10px;color:var(--gold);font-family:'Orbitron',sans-serif;flex-shrink:0}
.ctrl-group{margin-bottom:16px}
.ctrl-group label{display:block;font-size:12px;color:var(--cyan);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.radio-group{display:flex;gap:12px;flex-wrap:wrap}
.radio-group label{display:flex;align-items:center;gap:6px;font-size:12px;color:#bbb;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400}
.radio-group input[type=radio]{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:2px solid #444;border-radius:50%;cursor:pointer;position:relative;flex-shrink:0}
.radio-group input[type=radio]:checked{border-color:var(--green)}
.radio-group input[type=radio]:checked::after{content:'';position:absolute;inset:3px;background:var(--green);border-radius:50%}
.range-wrap{display:flex;align-items:center;gap:12px}
.range-wrap input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:#333;border-radius:2px;outline:none}
.range-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--green);border-radius:50%;cursor:pointer;box-shadow:0 0 8px rgba(57,255,20,.4)}
.range-val{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--gold);min-width:60px;text-align:right}
.btn-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn-primary{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;padding:12px 28px;border:2px solid var(--green);background:rgba(57,255,20,.08);color:var(--green);border-radius:30px;cursor:pointer;transition:all .3s;letter-spacing:1px}
.btn-primary:hover{background:rgba(57,255,20,.18);box-shadow:0 0 20px rgba(57,255,20,.2)}
.btn-secondary{font-size:13px;padding:12px 28px;border:1px solid #444;background:transparent;color:#888;border-radius:30px;cursor:pointer;transition:all .2s}
.btn-secondary:hover{border-color:var(--cyan);color:var(--cyan)}
.ctrl-note{font-size:11px;color:#555;margin-top:16px;font-style:italic}
.loading{text-align:center;padding:60px 20px;color:#666;font-size:14px}
.loading .spinner{display:inline-block;width:30px;height:30px;border:3px solid #333;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-state{text-align:center;padding:60px 20px;color:#ff4444;font-size:14px}
@media(max-width:600px){
.identity-card{flex-direction:column;text-align:center;align-items:center}
.id-badge{margin-left:0}
.id-meta{justify-content:center}
.slot{flex-direction:column;align-items:stretch}
.slot-num{text-align:left}
.slot-preview{white-space:normal}
.nav-arrows a span.nav-label{display:none}
}
.toggle-switch{position:relative;display:inline-block;width:48px;height:26px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#333;border-radius:26px;transition:.3s}
.toggle-slider:before{content:'';position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#888;border-radius:50%;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:rgba(57,255,20,.25);border:1px solid var(--green)}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(22px);background:var(--green)}
.run-agent-wrap{margin-bottom:20px;text-align:center}
.run-agent-btn{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;padding:12px 32px;border:2px solid var(--green);background:rgba(57,255,20,.08);color:var(--green);border-radius:40px;cursor:pointer;transition:all .3s;letter-spacing:1px}
.run-agent-btn:hover{background:rgba(57,255,20,.18);box-shadow:0 0 20px rgba(57,255,20,.3)}
.run-agent-btn:disabled{opacity:.5;cursor:not-allowed}
.run-agent-status{margin-top:10px;font-size:12px;color:#888;min-height:20px}
</style>
</head>
<body>

<div class="top-bar">
  <a href="/ecosystem-test.html" class="back-link">← Agent Control Dashboard</a>
  <div class="nav-arrows" id="navArrows"></div>
</div>

<div class="container">
  <div id="loadingState" class="loading">
    <div class="spinner"></div>
    <div>Loading agent profile...</div>
  </div>

  <div id="errorState" class="error-state" style="display:none"></div>

  <div id="profileContent" style="display:none">
    <div class="identity-card" id="identityCard"></div>

    <div class="run-agent-wrap">
      <button id="runAgentBtn" class="run-agent-btn" onclick="runSingleAgent()">▶ Run This Agent</button>
      <div id="runAgentStatus" class="run-agent-status"></div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="history">History</div>
      <div class="tab" data-tab="assets">Assets</div>
      <div class="tab" data-tab="controls">Controls</div>
    </div>

    <div class="tab-content active" id="tab-history"></div>
    <div class="tab-content" id="tab-assets"></div>
    <div class="tab-content" id="tab-controls"></div>
  </div>
</div>

<script>

{code:'ksr',name:'Kid Solar',icon:'\u2600\uFE0F',specialty:'Computronium Polymath'}

const CATEGORIES=['Computronium','Culture','Basic Needs','Rent','Energy','Music','Video','Art','Photo','Writing','AI Tools','AI Create','Software','Docs','Games','Utilities'];

const ITEM_PARTS={

'Video':{adj:['Cinematic','Drone','Time-Lapse','Volumetric','Holographic','Immersive','Documentary','Generative','Solar-Lit','RAW'],noun:['Film Reel','Tutorial Series','Music Video','Short Film','B-Roll Pack','VFX Template','Motion Study','Scene Kit','Footage Archive','Visual Essay'],suffix:['4K','8K','HDR',"Director's Cut",'Extended','Uncut','Remastered','Season 1','Premiere','Open License']},

};

function rnd(arr){return arr[Math.floor(Math.random()*arr.length)]}
function generateItemName(cat){
  const p=ITEM_PARTS[cat];
  if(!p) return cat+' Item';
  return rnd(p.adj)+' '+rnd(p.noun)+' '+rnd(p.suffix);
}

let currentAgent=null;
let apiData=null;
let config=null;

function getCode(){
  const p=new URLSearchParams(window.location.search);
  return p.get('code')||'01';
}

function findAgent(code){
  return AGENTS.find(a=>a.code===code);
}

function prevCode(code){
  const i=AGENTS.findIndex(a=>a.code===code);
  const pi=i<=0?AGENTS.length-1:i-1;
  return AGENTS[pi].code;
}

function nextCode(code){
  const i=AGENTS.findIndex(a=>a.code===code);
  const ni=i>=AGENTS.length-1?0:i+1;
  return AGENTS[ni].code;
}

function buildNav(code){
  const pc=prevCode(code);
  const nc=nextCode(code);
  const pa=findAgent(pc);
  const na=findAgent(nc);
  document.getElementById('navArrows').innerHTML=
    '<a href="?code='+pc+'">'+pa.icon+' <span class="nav-label">'+pa.name+'</span> ←</a>'+
    '<a href="?code='+nc+'">→ <span class="nav-label">'+na.name+'</span> '+na.icon+'</a>';
}

function buildIdentity(agent,data){
  var a=data&&data.agent?data.agent:data||{};
  const balance=a.balance!=null?parseFloat(a.balance).toFixed(4):'—';
  const memberId=a.memberId?a.memberId:'AGT-'+agent.code;
  const jd=a.joinedAt||a.joinDate;
  const joinDate=jd?new Date(jd).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'Genesis Member';
  document.getElementById('identityCard').innerHTML=
    '<div class="id-icon">'+agent.icon+'</div>'+
    '<div class="id-info">'+
      '<div class="id-name">Agent '+agent.name+'</div>'+
      '<div class="id-code">Code: '+agent.code+' &middot; '+agent.specialty+' Specialist</div>'+
      '<div class="id-specialty">'+agent.specialty+' Division</div>'+
      '<div class="id-meta">'+
        '<span><span class="lbl">Member ID:</span> <span class="val">'+memberId+'</span></span>'+
        '<span><span class="lbl">Balance:</span> <span class="val gold">'+balance+' Solar</span></span>'+
        '<span><span class="lbl">Joined:</span> <span class="val">'+joinDate+'</span></span>'+
      '</div>'+
    '</div>'+
    '<div class="id-badge"><span class="status-badge">Persistent Member</span></div>';
}

function buildHistory(data){
  const el=document.getElementById('tab-history');
  const txs=data&&data.transactions?data.transactions:[];
  if(!txs.length){
    el.innerHTML='<div class="section-title">Transaction History</div><div class="empty-state">No transactions recorded yet</div>';
    return;
  }
  const grouped={};
  txs.forEach(function(tx){
    const ts=tx.time||tx.timestamp;
    const d=ts?new Date(ts).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'Unknown';
    if(!grouped[d])grouped[d]=[];
    grouped[d].push(tx);
  });
  let html='<div class="section-title">Transaction History</div><table class="tx-table"><thead><tr><th></th><th>Description</th><th>Type</th><th>Amount</th><th>Balance</th><th>Time</th></tr></thead><tbody>';
  Object.keys(grouped).forEach(function(date){
    html+='<tr><td colspan="6" class="tx-date-group">'+date+'</td></tr>';
    grouped[date].forEach(function(tx){
      const isSale=tx.type==='credit'||(tx.description&&(tx.description.startsWith('Sale:')||tx.description.startsWith('Daily Solar')));
      const isPurchase=tx.type==='debit'||(tx.description&&tx.description.startsWith('Purchase:'));
      const isDebit=isSale||(!isPurchase&&tx.amount&&tx.amount>0);
      const icon=isDebit?'📈':'📉';
      const cls=isDebit?'tx-credit':'tx-debit';
      const sign=isDebit?'+':'-';
      const amt=typeof tx.amount==='number'?tx.amount:parseFloat(tx.amount||0);
      const displayAmt=Math.abs(amt);
      const bal=typeof tx.balanceAfter==='number'?tx.balanceAfter:(typeof tx.balance==='number'?tx.balance:null);
      const ts=tx.time||tx.timestamp;
      const time=ts?new Date(ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):'';
      const typeLabel=isDebit?'Debit':'Credit';
      const typeColor=isDebit?'var(--green)':'var(--orange)';
      html+='<tr>'+
        '<td class="tx-icon">'+icon+'</td>'+
        '<td class="tx-desc">'+(tx.description||tx.item||'Transaction')+'</td>'+
        '<td style="color:'+typeColor+';font-size:11px">'+typeLabel+'</td>'+
        '<td class="'+cls+'">'+sign+displayAmt.toFixed(4)+'</td>'+
        '<td class="tx-bal">'+(bal!=null?bal.toFixed(4):'—')+'</td>'+
        '<td class="tx-time">'+time+'</td>'+
        '</tr>';
    });
  });
  html+='</tbody></table>';
  el.innerHTML=html;
}

function buildAssets(data){
  const el=document.getElementById('tab-assets');
  const created=data&&data.created?data.created:[];
  const purchased=data&&data.purchased?data.purchased:[];
  let html='<div class="section-title">Created Artifacts</div>';
  if(!created.length){
    html+='<div class="empty-state">No artifacts created yet</div>';
  }else{
    html+='<div class="asset-grid">';
    created.forEach(function(item){
      const date=item.createdAt?new Date(item.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
      const status=item.active!==false?'active':'sold';
      html+='<div class="asset-card">'+
        '<div class="asset-cat">'+(item.category||'General')+'</div>'+
        '<div class="asset-title">'+(item.title||item.name||'Untitled')+'</div>'+
        '<div class="asset-price">'+(item.price!=null?parseFloat(item.price).toFixed(4):' — ')+' Solar</div>'+
        '<div class="asset-meta"><span>'+date+'</span><span class="asset-status '+status+'">'+(status==='active'?'Active':'Sold')+'</span></div>'+
        '</div>';
    });
    html+='</div>';
  }
  html+='<div class="section-title" style="margin-top:24px">Purchased Items</div>';
  if(!purchased.length){
    html+='<div class="empty-state">No items purchased yet</div>';
  }else{
    html+='<div class="asset-grid">';
    purchased.forEach(function(item){
      const date=item.acquiredAt||item.purchasedAt||item.createdAt;
      const dateStr=date?new Date(date).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
      const paid=item.solarPaid!=null?item.solarPaid:(item.price!=null?item.price:null);
      html+='<div class="asset-card">'+
        '<div class="asset-cat">'+(item.category||'General')+'</div>'+
        '<div class="asset-title">'+(item.title||item.name||'Untitled')+'</div>'+
        '<div class="asset-price">'+(paid!=null?parseFloat(paid).toFixed(4):' — ')+' Solar</div>'+
        '<div class="asset-meta"><span>'+dateStr+'</span><span style="font-size:10px;color:#888">'+(item.method||'Purchase')+'</span></div>'+
        '</div>';
    });
    html+='</div>';
  }
  el.innerHTML=html;
}

function getDefaultConfig(agent){
  var creationSlots=[];
  for(var i=0;i<5;i++){
    var cat=i<3?agent.specialty:CATEGORIES[Math.floor(Math.random()*CATEGORIES.length)];
    creationSlots.push({category:cat,name:generateItemName(cat)});
  }
  var purchaseSlots=[];
  for(var j=0;j<5;j++){
    if(j<2){
      purchaseSlots.push({category:'Basic Needs',locked:true});
    }else{
      var pc=j===2?agent.specialty:CATEGORIES[Math.floor(Math.random()*CATEGORIES.length)];
      purchaseSlots.push({category:pc,locked:false});
    }
  }
  return{
    runEnabled:true,
    spendingStyle:'balanced',
    categories:[agent.specialty],
    maxSpend:0.5,
    creationFocus:agent.specialty,
    creationSlots:creationSlots,
    purchaseSlots:purchaseSlots
  };
}

function loadConfig(code,agent){
  var key='agentConfig_'+code;
  var saved=localStorage.getItem(key);
  if(saved){
    try{
      var parsed=JSON.parse(saved);
      if(!parsed.creationSlots||!parsed.purchaseSlots){
        var def=getDefaultConfig(agent);
        parsed.creationSlots=parsed.creationSlots||def.creationSlots;
        parsed.purchaseSlots=parsed.purchaseSlots||def.purchaseSlots;
      }
      return parsed;
    }catch(e){}
  }
  return getDefaultConfig(agent);
}

function saveConfig(code){
  var key='agentConfig_'+code;
  localStorage.setItem(key,JSON.stringify(config));
}

function buildControls(agent){
  var el=document.getElementById('tab-controls');
  var html='';
  var runEnabled = config.runEnabled !== false;
  html += '<div class="ctrl-section">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center">';
  html += '<div><div class="ctrl-section-title">Run Status</div>';
  html += '<div class="ctrl-section-sub">Toggle whether this agent participates in collective runs</div></div>';
  html += '<label class="toggle-switch">';
  html += '<input type="checkbox" id="runToggle" ' + (runEnabled ? 'checked' : '') + ' onchange="config.runEnabled=this.checked;saveConfig(\'' + agent.code + '\')">';
  html += '<span class="toggle-slider"></span>';
  html += '</label>';
  html += '</div></div>';
  html+='<div class="ctrl-section">';
  html+='<div class="ctrl-section-title">Action Programming</div>';
  html+='<div class="ctrl-section-sub">System collectively determines assignments \u2014 adjust recommendations here</div>';
  html+='</div>';

  html+='<div class="ctrl-section">';
  html+='<div class="ctrl-section-title">Daily Creations</div>';
  html+='<div class="ctrl-section-sub">5 items created per cycle</div>';
  for(var i=0;i<5;i++){
    var cs=config.creationSlots[i];
    html+='<div class="slot" data-creation-slot="'+i+'">';
    html+='<div class="slot-num">#'+(i+1)+'</div>';
    html+='<select onchange="updateCreationSlot('+i+',this.value)">';
    CATEGORIES.forEach(function(c){
      html+='<option value="'+c+'"'+(cs.category===c?' selected':'')+'>'+c+'</option>';
    });
    html+='</select>';
    html+='<div class="slot-preview" id="creation-preview-'+i+'">'+cs.name+'</div>';
    html+='<button class="slot-btn" onclick="regenerateSlot('+i+')">Regenerate</button>';
    html+='</div>';
  }
  html+='</div>';

  html+='<div class="ctrl-section">';
  html+='<div class="ctrl-section-title">Daily Purchases</div>';
  html+='<div class="ctrl-section-sub">5 acquisitions per cycle</div>';
  for(var j=0;j<5;j++){
    var ps=config.purchaseSlots[j];
    var locked=ps.locked;
    html+='<div class="slot" data-purchase-slot="'+j+'">';
    html+='<div class="slot-num">#'+(j+1)+'</div>';
    if(locked) html+='<div class="slot-lock">\u{1F512}</div>';
    html+='<select onchange="updatePurchaseSlot('+j+',this.value)"'+(locked?' disabled':'')+'>';
    CATEGORIES.forEach(function(c){
      html+='<option value="'+c+'"'+(ps.category===c?' selected':'')+'>'+c+'</option>';
    });
    html+='</select>';
    html+='<div class="slot-price">0.01\u20130.10 Solar</div>';
    if(locked){
      html+='<span class="slot-badge mandatory">Mandatory</span>';
    }else{
      html+='<span class="slot-badge optional">Optional</span>';
    }
    if(locked){
      html+='<div class="slot-note">Every member must purchase 2 Basic Needs items daily</div>';
    }
    html+='</div>';
  }
  html+='</div>';

  html+='<div class="ctrl-section">';
  html+='<div class="ctrl-group"><label>Spending Style</label>';
  html+='<div class="radio-group">';
  ['conservative','balanced','aggressive'].forEach(function(s){
    html+='<label><input type="radio" name="spendingStyle" value="'+s+'"'+(config.spendingStyle===s?' checked':'')+' onchange="config.spendingStyle=this.value">'+s.charAt(0).toUpperCase()+s.slice(1)+'</label>';
  });
  html+='</div></div>';

  html+='<div class="ctrl-group"><label>Max Spend Per Transaction</label>';
  html+='<div class="range-wrap">';
  html+='<input type="range" min="0.01" max="1.0" step="0.01" value="'+config.maxSpend+'" oninput="config.maxSpend=parseFloat(this.value);document.getElementById(\'maxSpendVal\').textContent=this.value+\' Solar\'">';
  html+='<div class="range-val" id="maxSpendVal">'+config.maxSpend+' Solar</div>';
  html+='</div></div>';
  html+='</div>';

  html+='<div class="btn-row">';
  html+='<button class="btn-primary" onclick="saveConfig(\''+agent.code+'\')">Save Configuration</button>';
  html+='<button class="btn-secondary" onclick="resetConfig()">Reset to Defaults</button>';
  html+='</div>';
  html+='<div class="ctrl-note">Special requests can be handled via the multi-modal search window</div>';

  el.innerHTML=html;
}

function updateCreationSlot(i,cat){
  config.creationSlots[i].category=cat;
  config.creationSlots[i].name=generateItemName(cat);
  document.getElementById('creation-preview-'+i).textContent=config.creationSlots[i].name;
}

function regenerateSlot(i){
  config.creationSlots[i].name=generateItemName(config.creationSlots[i].category);
  document.getElementById('creation-preview-'+i).textContent=config.creationSlots[i].name;
}

function updatePurchaseSlot(i,cat){
  config.purchaseSlots[i].category=cat;
}

function resetConfig(){
  config=getDefaultConfig(currentAgent);
  buildControls(currentAgent);
}

document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.tab-content').forEach(function(tc){tc.classList.remove('active')});
    tab.classList.add('active');
    document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
  });
});

async function runSingleAgent() {
  var btn = document.getElementById('runAgentBtn');
  var status = document.getElementById('runAgentStatus');
  btn.disabled = true;
  btn.textContent = '⏳ Running...';
  status.textContent = 'Registering agent...';

  var code = getCode();
  var agent = findAgent(code);
  if (!agent) { status.textContent = 'Agent not found'; btn.disabled = false; btn.textContent = '▶ Run This Agent'; return; }

  var username = 'agent_eco_' + code;

  try {
    var res = await fetch('/api/ecosystem/resolve-agent', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: username})
    });
    var data = await res.json();
    if (data.success) {
      status.innerHTML = 'Agent resolved: member #' + data.memberId + ' with <span style="color:var(--gold)">' + data.balance.toFixed(1) + ' Solar</span>';
    } else {
      status.textContent = 'Agent not yet registered. Run collective first.';
      btn.disabled = false;
      btn.textContent = '▶ Run This Agent';
      return;
    }
  } catch(e) {
    status.textContent = 'Error: ' + e.message;
    btn.disabled = false;
    btn.textContent = '▶ Run This Agent';
    return;
  }

  status.textContent = 'Distributing daily Solar...';
  try {
    var dRes = await fetch('/api/ecosystem/distribute', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({memberId: data.memberId, amount: 1})
    });
    var dData = await dRes.json();
    if (dData.success) {
      status.innerHTML = 'Daily Solar distributed. New balance: <span style="color:var(--gold)">' + dData.newBalance.toFixed(1) + ' Solar</span>';
    }
  } catch(e) {}

  await new Promise(r => setTimeout(r, 500));

  status.textContent = 'Refreshing profile...';
  try {
    var pRes = await fetch('/api/agents/' + code);
    if (pRes.ok) {
      apiData = await pRes.json();
      var d = apiData.success ? apiData : apiData;
      buildIdentity(currentAgent, d);
      buildHistory(d);
      buildAssets(d);
    }
  } catch(e) {}

  status.innerHTML = '<span style="color:var(--green)">✓ Agent run complete</span>';
  btn.disabled = false;
  btn.textContent = '▶ Run This Agent';
}

async function init(){
  var code=getCode();
  currentAgent=findAgent(code);
  if(!currentAgent){
    document.getElementById('loadingState').style.display='none';
    document.getElementById('errorState').style.display='block';
    document.getElementById('errorState').textContent='Agent with code "'+code+'" not found.';
    return;
  }
  document.title='Agent '+currentAgent.name+' \u2014 TC-S Network';
  buildNav(code);
  config=loadConfig(code,currentAgent);
  try{
    var res=await fetch('/api/agents/'+code);
    if(res.ok){
      apiData=await res.json();
    }else{
      apiData={balance:1.0,memberId:'AGT-'+code,joinDate:new Date().toISOString(),transactions:[],created:[],purchased:[]};
    }
  }catch(e){
    apiData={balance:1.0,memberId:'AGT-'+code,joinDate:new Date().toISOString(),transactions:[],created:[],purchased:[]};
  }
  document.getElementById('loadingState').style.display='none';
  document.getElementById('profileContent').style.display='block';
  var d=apiData.success?apiData:apiData;
  buildIdentity(currentAgent,d);
  buildHistory(d);
  buildAssets(d);
  buildControls(currentAgent);
}

init();
</script>
