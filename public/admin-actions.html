<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Action Admin — TC-S Networks Foundation</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --solar-green: #39ff14;
      --solar-gold: #fbbf24;
      --status-pending: #f59e0b;
      --status-approved: #3b82f6;
      --status-running: #8b5cf6;
      --status-succeeded: #10b981;
      --status-failed: #ef4444;
      --status-rejected: #6b7280;
      --dark-bg: #0a0a0a;
      --card-bg: rgba(20, 20, 20, 0.95);
      --border-color: rgba(57, 255, 20, 0.3);
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--dark-bg);
      color: #fff;
      min-height: 100vh;
      padding: 2rem;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }
    
    .header h1 {
      color: var(--solar-green);
      font-size: 1.8rem;
    }
    
    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    
    .btn {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: var(--solar-green);
      color: #000;
    }
    
    .btn-primary:hover {
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
    }
    
    .btn-secondary {
      background: transparent;
      color: #a0aec0;
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .btn-approve {
      background: var(--status-approved);
      color: #fff;
    }
    
    .btn-execute {
      background: var(--status-succeeded);
      color: #fff;
    }
    
    .btn-reject {
      background: var(--status-rejected);
      color: #fff;
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--solar-green);
    }
    
    .stat-label {
      font-size: 0.85rem;
      color: #a0aec0;
      margin-top: 0.25rem;
    }
    
    .actions-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .action-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.2s;
    }
    
    .action-card:hover {
      border-color: var(--solar-green);
    }
    
    .action-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    
    .action-type {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--solar-green);
    }
    
    .action-id {
      font-family: monospace;
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 0.25rem;
    }
    
    .status-badge {
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .status-pending { background: rgba(245, 158, 11, 0.2); color: var(--status-pending); }
    .status-approved { background: rgba(59, 130, 246, 0.2); color: var(--status-approved); }
    .status-running { background: rgba(139, 92, 246, 0.2); color: var(--status-running); }
    .status-succeeded { background: rgba(16, 185, 129, 0.2); color: var(--status-succeeded); }
    .status-failed { background: rgba(239, 68, 68, 0.2); color: var(--status-failed); }
    .status-rejected { background: rgba(107, 114, 128, 0.2); color: var(--status-rejected); }
    
    .action-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    
    .meta-item {
      display: flex;
      flex-direction: column;
    }
    
    .meta-label {
      color: #6b7280;
      font-size: 0.8rem;
    }
    
    .meta-value {
      color: #fff;
    }
    
    .policy-section {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    
    .policy-title {
      font-size: 0.9rem;
      color: #a0aec0;
      margin-bottom: 0.5rem;
    }
    
    .policy-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    
    .check-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: rgba(255,255,255,0.05);
    }
    
    .check-pass { color: var(--status-succeeded); }
    .check-fail { color: var(--status-failed); }
    
    .spec-preview {
      background: rgba(0,0,0,0.5);
      border-radius: 6px;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.8rem;
      color: #a0aec0;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
    }
    
    .action-buttons {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .result-section {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
    }
    
    .result-title {
      color: var(--status-succeeded);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .error-section {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
    }
    
    .error-title {
      color: var(--status-failed);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #6b7280;
    }
    
    .empty-state h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
    
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    .filter-tab {
      padding: 0.5rem 1rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      background: transparent;
      color: #a0aec0;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .filter-tab.active {
      background: var(--solar-green);
      color: #000;
      border-color: var(--solar-green);
    }
    
    .filter-tab:hover:not(.active) {
      border-color: var(--solar-green);
      color: var(--solar-green);
    }
    
    .loading {
      text-align: center;
      padding: 3rem;
      color: #6b7280;
    }
    
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }
    
    .toast-success {
      background: var(--status-succeeded);
      color: #fff;
    }
    
    .toast-error {
      background: var(--status-failed);
      color: #fff;
    }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Action Admin Console</h1>
      <p style="color: #6b7280; font-size: 0.9rem;">Manage pending action requests</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="refreshActions()">Refresh</button>
      <a href="/" class="btn btn-secondary">Back to Home</a>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card">
      <div class="stat-value" id="stat-pending">-</div>
      <div class="stat-label">Pending</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-approved">-</div>
      <div class="stat-label">Approved</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-succeeded">-</div>
      <div class="stat-label">Succeeded</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-failed">-</div>
      <div class="stat-label">Failed</div>
    </div>
  </div>

  <div class="filter-tabs">
    <button class="filter-tab active" data-filter="all">All</button>
    <button class="filter-tab" data-filter="pending">Pending</button>
    <button class="filter-tab" data-filter="approved">Approved</button>
    <button class="filter-tab" data-filter="succeeded">Succeeded</button>
    <button class="filter-tab" data-filter="failed">Failed</button>
  </div>

  <div class="actions-list" id="actions-list">
    <div class="loading">Loading actions...</div>
  </div>

  <script>
    let allActions = [];
    let currentFilter = 'all';
    const ADMIN_TOKEN = localStorage.getItem('admin_token') || '';

    async function fetchActions() {
      try {
        const response = await fetch('/api/agentic/pending');
        const pendingData = await response.json();
        
        const allResponse = await fetch('/api/agentic/actions/list?limit=50', {
          headers: { 'X-Admin': 'true' }
        });
        
        if (allResponse.ok) {
          const allData = await allResponse.json();
          allActions = allData.actions || [];
        } else {
          allActions = pendingData.actions || [];
        }
        
        updateStats();
        renderActions();
      } catch (error) {
        console.error('Failed to fetch actions:', error);
        document.getElementById('actions-list').innerHTML = `
          <div class="empty-state">
            <h3>Error loading actions</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    function updateStats() {
      const stats = {
        pending: allActions.filter(a => a.status === 'pending').length,
        approved: allActions.filter(a => a.status === 'approved').length,
        succeeded: allActions.filter(a => a.status === 'succeeded').length,
        failed: allActions.filter(a => a.status === 'failed' || a.status === 'rejected').length
      };
      
      document.getElementById('stat-pending').textContent = stats.pending;
      document.getElementById('stat-approved').textContent = stats.approved;
      document.getElementById('stat-succeeded').textContent = stats.succeeded;
      document.getElementById('stat-failed').textContent = stats.failed;
    }

    function renderActions() {
      const container = document.getElementById('actions-list');
      
      let filtered = allActions;
      if (currentFilter !== 'all') {
        if (currentFilter === 'failed') {
          filtered = allActions.filter(a => a.status === 'failed' || a.status === 'rejected');
        } else {
          filtered = allActions.filter(a => a.status === currentFilter);
        }
      }
      
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No actions found</h3>
            <p>No ${currentFilter === 'all' ? '' : currentFilter} action requests at this time.</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = filtered.map(action => renderActionCard(action)).join('');
    }

    function renderActionCard(action) {
      const spec = action.network_spec || action.payload || {};
      const policyChecks = action.policy_checks || [];
      const result = action.result || null;
      const error = action.error_message || null;
      
      const statusClass = `status-${action.status}`;
      const canApprove = action.status === 'pending';
      const canExecute = action.status === 'approved';
      const canReject = action.status === 'pending';
      
      let policyHtml = '';
      if (policyChecks.length > 0) {
        policyHtml = `
          <div class="policy-section">
            <div class="policy-title">Policy Checks</div>
            <div class="policy-checks">
              ${policyChecks.map(check => `
                <span class="check-item ${check.passed ? 'check-pass' : 'check-fail'}">
                  ${check.passed ? '✓' : '✗'} ${check.rule}
                </span>
              `).join('')}
            </div>
          </div>
        `;
      }
      
      let resultHtml = '';
      if (result && action.status === 'succeeded') {
        resultHtml = `
          <div class="result-section">
            <div class="result-title">Result</div>
            <div class="spec-preview">${JSON.stringify(result, null, 2)}</div>
          </div>
        `;
      }
      
      let errorHtml = '';
      if (error) {
        errorHtml = `
          <div class="error-section">
            <div class="error-title">Error</div>
            <p>${error}</p>
          </div>
        `;
      }
      
      return `
        <div class="action-card" data-id="${action.id}">
          <div class="action-header">
            <div>
              <div class="action-type">${action.action_type}</div>
              <div class="action-id">${action.id}</div>
            </div>
            <span class="status-badge ${statusClass}">${action.status}</span>
          </div>
          
          <div class="action-meta">
            <div class="meta-item">
              <span class="meta-label">Agent</span>
              <span class="meta-value">${action.agent_id || 'unknown'}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Created</span>
              <span class="meta-value">${new Date(action.created_at).toLocaleString()}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Network Name</span>
              <span class="meta-value">${spec.name || '-'}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Network Type</span>
              <span class="meta-value">${spec.networkType || '-'}</span>
            </div>
          </div>
          
          ${policyHtml}
          
          <div style="margin-top: 1rem;">
            <div style="color: #6b7280; font-size: 0.8rem; margin-bottom: 0.5rem;">Spec Preview</div>
            <div class="spec-preview">${JSON.stringify(spec, null, 2)}</div>
          </div>
          
          ${resultHtml}
          ${errorHtml}
          
          <div class="action-buttons">
            <button class="btn btn-approve" onclick="approveAction('${action.id}')" ${canApprove ? '' : 'disabled'}>
              Approve
            </button>
            <button class="btn btn-execute" onclick="executeAction('${action.id}')" ${canExecute ? '' : 'disabled'}>
              Execute
            </button>
            <button class="btn btn-reject" onclick="rejectAction('${action.id}')" ${canReject ? '' : 'disabled'}>
              Reject
            </button>
            <button class="btn btn-secondary" onclick="refreshAction('${action.id}')">
              Refresh
            </button>
          </div>
        </div>
      `;
    }

    async function approveAction(id) {
      try {
        const response = await fetch(`/api/agentic/actions/${id}/approve`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-Admin': 'true'
          },
          body: JSON.stringify({})
        });
        
        const result = await response.json();
        
        if (result.success || result.status === 'approved') {
          showToast('Action approved successfully', 'success');
          refreshActions();
        } else {
          showToast(result.error || 'Failed to approve', 'error');
        }
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    async function executeAction(id) {
      try {
        const response = await fetch(`/api/agentic/actions/${id}/execute`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-Admin': 'true'
          },
          body: JSON.stringify({})
        });
        
        const result = await response.json();
        
        if (result.success || result.status === 'succeeded') {
          showToast('Action executed successfully', 'success');
          refreshActions();
        } else {
          showToast(result.error || 'Execution failed', 'error');
        }
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    async function rejectAction(id) {
      const reason = prompt('Enter rejection reason:');
      if (!reason) return;
      
      try {
        const response = await fetch(`/api/agentic/actions/${id}/reject`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-Admin': 'true'
          },
          body: JSON.stringify({ reason })
        });
        
        const result = await response.json();
        
        if (result.success || result.status === 'rejected') {
          showToast('Action rejected', 'success');
          refreshActions();
        } else {
          showToast(result.error || 'Failed to reject', 'error');
        }
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    async function refreshAction(id) {
      try {
        const response = await fetch(`/api/agentic/actions/${id}`);
        const result = await response.json();
        
        if (result.success) {
          const idx = allActions.findIndex(a => a.id === id);
          if (idx !== -1) {
            allActions[idx] = { ...allActions[idx], ...result };
            renderActions();
          }
        }
      } catch (error) {
        console.error('Failed to refresh action:', error);
      }
    }

    function refreshActions() {
      fetchActions();
    }

    function showToast(message, type) {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => toast.remove(), 3000);
    }

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderActions();
      });
    });

    fetchActions();
    setInterval(fetchActions, 30000);
  </script>
</body>
</html>
