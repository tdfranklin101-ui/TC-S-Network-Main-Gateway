<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Profile — TC-S Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#39FF14;--cyan:#00bfff;--purple:#8a2be2;--orange:#ffa500;--gold:#ffd700;--bg:#0a0a0a;--card:#111;--border:#222}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:#e0e0e0;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(57,255,20,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,20,.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#555}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;position:relative;z-index:1}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--cyan);transition:color .2s}
.back-link:hover{color:var(--green);text-decoration:none}
.nav-links{display:flex;gap:8px}
.nav-links a{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:#aaa;transition:all .2s}
.nav-links a:hover{border-color:var(--green);color:var(--green);text-decoration:none}
.container{max-width:900px;margin:0 auto;padding:0 16px 60px;position:relative;z-index:1}
.identity-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.id-icon{font-size:56px;line-height:1}
.id-info{flex:1;min-width:200px}
.id-name{font-family:'Orbitron',sans-serif;font-size:clamp(22px,4vw,32px);font-weight:900;background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.id-code{font-size:13px;color:#888;margin-top:2px}
.id-specialty{font-size:13px;color:var(--purple);margin-top:4px;font-weight:600}
.id-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:12px}
.id-meta span{display:flex;align-items:center;gap:4px}
.id-meta .lbl{color:#666}
.id-meta .val{color:var(--cyan);font-weight:600}
.id-meta .val.gold{color:var(--gold);font-family:'Orbitron',sans-serif}
.id-badge{margin-left:auto;align-self:flex-start}
.status-badge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.status-badge.agent{background:rgba(57,255,20,.12);color:var(--green);border:1px solid rgba(57,255,20,.3)}
.status-badge.member{background:rgba(0,191,255,.12);color:var(--cyan);border:1px solid rgba(0,191,255,.3)}
.status-badge.foundation{background:rgba(255,215,0,.12);color:var(--gold);border:1px solid rgba(255,215,0,.3)}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px}
.tab{flex:1;padding:14px;text-align:center;font-size:13px;font-weight:600;color:#666;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;text-transform:uppercase;letter-spacing:1px;user-select:none}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.tab:hover:not(.active){color:var(--cyan)}
.tab.hidden{display:none}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-size:13px;color:var(--cyan);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:600;display:flex;align-items:center;gap:8px}
.empty-state{color:#555;font-size:13px;padding:24px;text-align:center;font-style:italic;border:1px dashed #333;border-radius:10px}
.tx-table{width:100%;border-collapse:collapse}
.tx-table th{text-align:left;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px;padding:8px 10px;border-bottom:1px solid var(--border)}
.tx-table td{padding:8px 10px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.03)}
.tx-date-group{font-size:11px;color:var(--cyan);padding:10px 10px 4px;font-weight:600;background:rgba(0,191,255,.04)}
.tx-credit{color:var(--green);font-family:'Orbitron',sans-serif;font-size:11px}
.tx-debit{color:var(--orange);font-family:'Orbitron',sans-serif;font-size:11px}
.tx-bal{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:10px}
.tx-icon{font-size:14px}
.tx-desc{color:#bbb}
.tx-time{color:#555;font-size:10px}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:24px}
.asset-card{background:#0d0d0d;border:1px solid var(--border);border-radius:10px;padding:14px;transition:border-color .2s}
.asset-card:hover{border-color:var(--cyan)}
.asset-title{font-size:13px;font-weight:600;color:#ddd;margin-bottom:6px}
.asset-cat{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--purple);background:rgba(138,43,226,.1);padding:2px 8px;border-radius:10px;margin-bottom:6px}
.asset-price{font-size:12px;color:var(--gold);font-family:'Orbitron',sans-serif}
.asset-meta{font-size:10px;color:#555;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.asset-status{font-size:9px;padding:2px 8px;border-radius:10px}
.asset-status.active{background:rgba(57,255,20,.12);color:var(--green)}
.asset-status.sold{background:rgba(255,165,0,.12);color:var(--orange)}
.grant-form{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.grant-form-title{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--green);margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--cyan);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;background:#0a0a0a;border:1px solid #333;color:#ccc;padding:10px 12px;border-radius:8px;font-size:13px;font-family:'Space Grotesk',sans-serif;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--green);color:var(--green)}
.form-group textarea{min-height:80px;resize:vertical}
.btn-primary{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;padding:12px 28px;border:2px solid var(--green);background:rgba(57,255,20,.08);color:var(--green);border-radius:30px;cursor:pointer;transition:all .3s;letter-spacing:1px}
.btn-primary:hover{background:rgba(57,255,20,.18);box-shadow:0 0 20px rgba(57,255,20,.2)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.petition-list{margin-top:20px}
.petition-card{background:#0d0d0d;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.petition-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.petition-title{font-size:14px;font-weight:600;color:#ddd}
.petition-status{font-size:10px;padding:3px 10px;border-radius:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.petition-status.pending{background:rgba(255,215,0,.12);color:var(--gold);border:1px solid rgba(255,215,0,.3)}
.petition-status.approved{background:rgba(57,255,20,.12);color:var(--green);border:1px solid rgba(57,255,20,.3)}
.petition-status.denied{background:rgba(255,68,68,.12);color:#ff4444;border:1px solid rgba(255,68,68,.3)}
.petition-desc{font-size:12px;color:#888;margin-bottom:6px}
.petition-meta{font-size:11px;color:#555;display:flex;gap:16px;flex-wrap:wrap}
.petition-meta .val{color:var(--cyan);font-weight:600}
.petition-meta .amt{color:var(--gold);font-family:'Orbitron',sans-serif}
.foundation-section{background:var(--card);border:1px solid rgba(255,215,0,.2);border-radius:12px;padding:20px;margin-bottom:20px}
.foundation-title{font-family:'Orbitron',sans-serif;font-size:16px;color:var(--gold);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.foundation-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.foundation-stat{background:#0d0d0d;border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.foundation-stat .stat-label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.foundation-stat .stat-value{font-family:'Orbitron',sans-serif;font-size:18px;color:var(--gold);font-weight:700}
.foundation-link{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid rgba(255,215,0,.3);border-radius:8px;font-size:12px;color:var(--gold);transition:all .2s}
.foundation-link:hover{background:rgba(255,215,0,.08);text-decoration:none}
.settings-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
.settings-title{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--green);margin-bottom:8px}
.settings-placeholder{font-size:13px;color:#555;font-style:italic}
.loading{text-align:center;padding:60px 20px;color:#666;font-size:14px}
.loading .spinner{display:inline-block;width:30px;height:30px;border:3px solid #333;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-state{text-align:center;padding:60px 20px;color:#ff4444;font-size:14px}
.submit-msg{margin-top:10px;font-size:12px;min-height:18px}
.submit-msg.success{color:var(--green)}
.submit-msg.error{color:#ff4444}
@media(max-width:600px){
.identity-card{flex-direction:column;text-align:center;align-items:center}
.id-badge{margin-left:0}
.id-meta{justify-content:center}
.nav-links a span.link-label{display:none}
.tabs{flex-wrap:wrap}
.tab{padding:10px 8px;font-size:11px;letter-spacing:.5px}
.tx-table{font-size:11px}
.tx-table th,.tx-table td{padding:6px 6px}
.foundation-stats{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="top-bar">
  <a href="/marketplace.html" class="back-link">← Marketplace</a>
  <div class="nav-links" id="navLinks"></div>
</div>

<div class="container">
  <div id="loadingState" class="loading">
    <div class="spinner"></div>
    <div>Loading member profile...</div>
  </div>

  <div id="errorState" class="error-state" style="display:none"></div>

  <div id="profileContent" style="display:none">
    <div class="identity-card" id="identityCard"></div>

    <div id="foundationSection" style="display:none"></div>

    <div class="tabs" id="tabBar"></div>

    <div class="tab-content active" id="tab-activity"></div>
    <div class="tab-content" id="tab-assets"></div>
    <div class="tab-content" id="tab-grants" style="display:none"></div>
    <div class="tab-content" id="tab-settings" style="display:none"></div>
  </div>
</div>

<script>
const AGENTS=[
{code:'01',name:'Alpha',icon:'🅰️',specialty:'Computronium'},
{code:'02',name:'Bravo',icon:'🅱️',specialty:'Culture'},
{code:'03',name:'Charlie',icon:'©️',specialty:'Basic Needs'},
{code:'04',name:'Delta',icon:'🔺',specialty:'Rent'},
{code:'05',name:'Echo',icon:'📡',specialty:'Energy'},
{code:'06',name:'Foxtrot',icon:'🦊',specialty:'Music'},
{code:'07',name:'Golf',icon:'⛳',specialty:'Video'},
{code:'08',name:'Hotel',icon:'🏨',specialty:'Art'},
{code:'09',name:'India',icon:'🇮🇳',specialty:'Photo'},
{code:'10',name:'Juliet',icon:'🌹',specialty:'Writing'},
{code:'11',name:'Kilo',icon:'⚖️',specialty:'AI Tools'},
{code:'12',name:'Lima',icon:'🌿',specialty:'AI Create'},
{code:'13',name:'Nova',icon:'💫',specialty:'Software'},
{code:'14',name:'Orion',icon:'🌌',specialty:'Docs'},
{code:'15',name:'Pulse',icon:'💓',specialty:'Games'},
{code:'16',name:'Quasar',icon:'✨',specialty:'Utilities'},
{code:'17',name:'Radiant',icon:'☀️',specialty:'Computronium'},
{code:'18',name:'Solaris',icon:'🔆',specialty:'Energy'},
{code:'19',name:'Tesla',icon:'⚡',specialty:'AI Tools'},
{code:'20',name:'Zenith',icon:'🏔️',specialty:'Culture'},
{code:'ks',name:'KID SOL',icon:'👑',specialty:'Orchestrator'},
{code:'ksr',name:'Kid Solar',icon:'🌞',specialty:'Freelance Polymath'}
];

const GRANT_CATEGORIES=['shelter','energy','food','medicine','education','infrastructure','environment','technology'];

let profileData=null;

function getUsername(){
  return new URLSearchParams(window.location.search).get('username')||'';
}

function findAgentByUsername(username){
  if(!username.startsWith('agent_eco_')) return null;
  const code=username.replace('agent_eco_','');
  return AGENTS.find(a=>a.code===code)||null;
}

function isFoundation(username){
  return username==='foundation'||username==='tc_s_foundation';
}

function showError(msg){
  document.getElementById('loadingState').style.display='none';
  var el=document.getElementById('errorState');
  el.style.display='block';
  el.textContent=msg;
}

function showProfile(){
  document.getElementById('loadingState').style.display='none';
  document.getElementById('profileContent').style.display='block';
}

function buildIdentity(member,publicData,isAgent,agentInfo,isFoundationProfile){
  var icon='👤';
  var name=member.name||member.username;
  var subtitle='TC-S Network Member';
  var badgeClass='member';
  var badgeText='Member';
  var specialtyLine='';

  if(isFoundationProfile){
    icon='🏛️';
    name='TC-S Foundation';
    subtitle='Foundation Reserve';
    badgeClass='foundation';
    badgeText='Foundation';
  }else if(isAgent&&agentInfo){
    icon=agentInfo.icon;
    name='Agent '+agentInfo.name;
    subtitle=agentInfo.specialty+' Specialist';
    badgeClass='agent';
    badgeText='Agent';
    specialtyLine='<div class="id-specialty">'+agentInfo.specialty+' Division</div>';
  }else if(isAgent){
    icon=member.icon||'🤖';
    name=member.name||member.username;
    subtitle=member.specialty?member.specialty+' Specialist':'AI Agent';
    badgeClass='agent';
    badgeText='Agent';
    if(member.specialty) specialtyLine='<div class="id-specialty">'+member.specialty+' Division</div>';
  }

  var balance=publicData.balance!=null?parseFloat(publicData.balance).toFixed(4):'—';
  var memberId=member.id?'MBR-'+member.id:(agentInfo?'AGT-'+agentInfo.code:'—');
  var jd=member.joinedAt||member.joinDate;
  var joinDate=jd?new Date(jd).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'Genesis Member';

  document.getElementById('identityCard').innerHTML=
    '<div class="id-icon">'+icon+'</div>'+
    '<div class="id-info">'+
      '<div class="id-name">'+name+'</div>'+
      '<div class="id-code">@'+member.username+'</div>'+
      specialtyLine+
      '<div class="id-meta">'+
        '<span><span class="lbl">Member ID:</span> <span class="val">'+memberId+'</span></span>'+
        '<span><span class="lbl">Balance:</span> <span class="val gold">'+balance+' Solar</span></span>'+
        '<span><span class="lbl">Joined:</span> <span class="val">'+joinDate+'</span></span>'+
      '</div>'+
    '</div>'+
    '<div class="id-badge"><span class="status-badge '+badgeClass+'">'+badgeText+'</span></div>';

  document.title=name+' — TC-S Network';
}

function buildTabs(isAgent,isOwnProfile,isFoundationProfile){
  var tabs=[{id:'activity',label:'Activity'}];
  tabs.push({id:'assets',label:'Assets'});
  if(isAgent) tabs.push({id:'grants',label:'Grants'});
  if(isOwnProfile) tabs.push({id:'settings',label:'Settings'});

  var html='';
  tabs.forEach(function(t,i){
    html+='<div class="tab'+(i===0?' active':'')+'" data-tab="'+t.id+'">'+t.label+'</div>';
  });
  document.getElementById('tabBar').innerHTML=html;

  if(isAgent) document.getElementById('tab-grants').style.display='';
  if(isOwnProfile) document.getElementById('tab-settings').style.display='';

  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
      document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active')});
      tab.classList.add('active');
      var target=document.getElementById('tab-'+tab.dataset.tab);
      if(target) target.classList.add('active');
    });
  });
}

function buildActivity(txs){
  var el=document.getElementById('tab-activity');
  if(!txs||!txs.length){
    el.innerHTML='<div class="section-title">Transaction History</div><div class="empty-state">No transactions recorded yet</div>';
    return;
  }
  var grouped={};
  txs.forEach(function(tx){
    var ts=tx.time||tx.timestamp||tx.createdAt;
    var d=ts?new Date(ts).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'Unknown';
    if(!grouped[d])grouped[d]=[];
    grouped[d].push(tx);
  });
  var html='<div class="section-title">Transaction History</div><table class="tx-table"><thead><tr><th></th><th>Description</th><th>Type</th><th>Amount</th><th>Balance</th><th>Time</th></tr></thead><tbody>';
  Object.keys(grouped).forEach(function(date){
    html+='<tr><td colspan="6" class="tx-date-group">'+date+'</td></tr>';
    grouped[date].forEach(function(tx){
      var isCredit=tx.type==='credit'||(tx.description&&(tx.description.indexOf('Sale:')===0||tx.description.indexOf('Daily Solar')===0));
      var isDebitTx=tx.type==='debit'||(tx.description&&tx.description.indexOf('Purchase:')===0);
      var positive=isCredit||(!isDebitTx&&tx.amount&&tx.amount>0);
      var icon=positive?'📈':'📉';
      var cls=positive?'tx-credit':'tx-debit';
      var sign=positive?'+':'-';
      var amt=typeof tx.amount==='number'?tx.amount:parseFloat(tx.amount||0);
      var displayAmt=Math.abs(amt);
      var bal=typeof tx.balanceAfter==='number'?tx.balanceAfter:(typeof tx.balance==='number'?tx.balance:null);
      var ts=tx.time||tx.timestamp||tx.createdAt;
      var time=ts?new Date(ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):'';
      var typeLabel=positive?'Credit':'Debit';
      var typeColor=positive?'var(--green)':'var(--orange)';
      html+='<tr>'+
        '<td class="tx-icon">'+icon+'</td>'+
        '<td class="tx-desc">'+(tx.description||tx.item||'Transaction')+'</td>'+
        '<td style="color:'+typeColor+';font-size:11px">'+typeLabel+'</td>'+
        '<td class="'+cls+'">'+sign+displayAmt.toFixed(4)+'</td>'+
        '<td class="tx-bal">'+(bal!=null?parseFloat(bal).toFixed(4):'—')+'</td>'+
        '<td class="tx-time">'+time+'</td>'+
        '</tr>';
    });
  });
  html+='</tbody></table>';
  el.innerHTML=html;
}

function buildAssets(created,purchased){
  var el=document.getElementById('tab-assets');
  var html='<div class="section-title">Created Artifacts</div>';
  if(!created||!created.length){
    html+='<div class="empty-state">No artifacts created yet</div>';
  }else{
    html+='<div class="asset-grid">';
    created.forEach(function(item){
      var date=item.createdAt?new Date(item.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
      var status=item.active!==false?'active':'sold';
      var statusLabel=item.active!==false?'Active':'Sold';
      var price=item.price!=null?parseFloat(item.price).toFixed(4)+' ☀️':'—';
      html+='<div class="asset-card">'+
        '<div class="asset-cat">'+(item.category||'General')+'</div>'+
        '<div class="asset-title">'+(item.title||item.name||'Untitled')+'</div>'+
        '<div class="asset-price">'+price+'</div>'+
        '<div class="asset-meta"><span>'+date+'</span><span class="asset-status '+status+'">'+statusLabel+'</span></div>'+
        '</div>';
    });
    html+='</div>';
  }

  html+='<div class="section-title" style="margin-top:24px">Purchased Artifacts</div>';
  if(!purchased||!purchased.length){
    html+='<div class="empty-state">No artifacts purchased yet</div>';
  }else{
    html+='<div class="asset-grid">';
    purchased.forEach(function(item){
      var date=item.purchasedAt||item.createdAt;
      var dateStr=date?new Date(date).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
      var price=item.price!=null?parseFloat(item.price).toFixed(4)+' ☀️':'—';
      html+='<div class="asset-card">'+
        '<div class="asset-cat">'+(item.category||'General')+'</div>'+
        '<div class="asset-title">'+(item.title||item.name||'Untitled')+'</div>'+
        '<div class="asset-price">'+price+'</div>'+
        '<div class="asset-meta"><span>'+dateStr+'</span><span class="asset-status active">Owned</span></div>'+
        '</div>';
    });
    html+='</div>';
  }
  el.innerHTML=html;
}

function buildGrants(petitions,isOwnProfile,username){
  var el=document.getElementById('tab-grants');
  var html='';

  if(isOwnProfile){
    html+='<div class="grant-form">'+
      '<div class="grant-form-title">Submit Grant Petition</div>'+
      '<div class="form-group"><label>Title</label><input type="text" id="grantTitle" placeholder="Petition title..."></div>'+
      '<div class="form-group"><label>Description</label><textarea id="grantDesc" placeholder="Describe the purpose and impact of this grant..."></textarea></div>'+
      '<div class="form-group"><label>Category</label><select id="grantCategory">';
    GRANT_CATEGORIES.forEach(function(c){
      html+='<option value="'+c+'">'+c.charAt(0).toUpperCase()+c.slice(1)+'</option>';
    });
    html+='</select></div>'+
      '<div class="form-group"><label>Requested Amount (Solar)</label><input type="number" id="grantAmount" placeholder="0.0000" step="0.0001" min="0.0001"></div>'+
      '<button class="btn-primary" id="submitGrantBtn" onclick="submitGrant()">Submit Petition</button>'+
      '<div class="submit-msg" id="grantMsg"></div>'+
      '</div>';
  }

  html+='<div class="section-title">Grant Petitions</div>';
  if(!petitions||!petitions.length){
    html+='<div class="empty-state">No grant petitions submitted yet</div>';
  }else{
    html+='<div class="petition-list">';
    petitions.forEach(function(p){
      var status=p.status||'pending';
      var statusLabel=status.charAt(0).toUpperCase()+status.slice(1);
      var date=p.createdAt?new Date(p.createdAt).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'';
      var amt=p.amount!=null?parseFloat(p.amount).toFixed(4):'—';
      html+='<div class="petition-card">'+
        '<div class="petition-header">'+
          '<div class="petition-title">'+(p.title||'Untitled Petition')+'</div>'+
          '<span class="petition-status '+status+'">'+statusLabel+'</span>'+
        '</div>'+
        '<div class="petition-desc">'+(p.description||'')+'</div>'+
        '<div class="petition-meta">'+
          '<span>Category: <span class="val">'+(p.category||'—')+'</span></span>'+
          '<span>Amount: <span class="amt">'+amt+' Solar</span></span>'+
          '<span>Filed: <span class="val">'+date+'</span></span>'+
        '</div>'+
        '</div>';
    });
    html+='</div>';
  }
  el.innerHTML=html;
}

function buildFoundation(publicData){
  var el=document.getElementById('foundationSection');
  var balance=publicData.balance!=null?parseFloat(publicData.balance).toFixed(4):'—';
  var feeIncome=publicData.feeIncome!=null?parseFloat(publicData.feeIncome).toFixed(4):'—';
  var grantsDisbursed=publicData.grantsDisbursed!=null?parseFloat(publicData.grantsDisbursed).toFixed(4):'—';

  el.innerHTML=
    '<div class="foundation-section">'+
      '<div class="foundation-title">🏛️ Foundation Overview</div>'+
      '<div class="foundation-stats">'+
        '<div class="foundation-stat"><div class="stat-label">Reserve Balance</div><div class="stat-value">'+balance+'</div></div>'+
        '<div class="foundation-stat"><div class="stat-label">Fee Income</div><div class="stat-value">'+feeIncome+'</div></div>'+
        '<div class="foundation-stat"><div class="stat-label">Grants Disbursed</div><div class="stat-value">'+grantsDisbursed+'</div></div>'+
      '</div>'+
      '<a href="/admin/global-solar-admin.html" class="foundation-link">⚙️ Review Pending Petitions</a>'+
    '</div>';
  el.style.display='block';
}

function buildSettings(){
  var el=document.getElementById('tab-settings');
  el.innerHTML=
    '<div class="settings-section">'+
      '<div class="settings-title">Profile Settings</div>'+
      '<div class="settings-placeholder">Profile preferences and notification settings will be available here in a future update.</div>'+
    '</div>';
}

function buildNavLinks(isAgent,agentInfo){
  var html='';
  if(isAgent&&agentInfo){
    html+='<a href="/agent-profile.html?code='+agentInfo.code+'"><span class="link-label">Agent Controls</span> ⚙️</a>';
  }
  document.getElementById('navLinks').innerHTML=html;
}

async function submitGrant(){
  var title=document.getElementById('grantTitle').value.trim();
  var desc=document.getElementById('grantDesc').value.trim();
  var category=document.getElementById('grantCategory').value;
  var amount=parseFloat(document.getElementById('grantAmount').value);
  var msgEl=document.getElementById('grantMsg');
  var btn=document.getElementById('submitGrantBtn');

  if(!title||!desc||!amount||amount<=0){
    msgEl.className='submit-msg error';
    msgEl.textContent='Please fill in all fields with valid values.';
    return;
  }

  btn.disabled=true;
  msgEl.className='submit-msg';
  msgEl.textContent='Submitting...';

  try{
    var username=getUsername();
    var res=await fetch('/api/grants/petition',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:username,title:title,description:desc,category:category,amount:amount})
    });
    var data=await res.json();
    if(data.success){
      msgEl.className='submit-msg success';
      msgEl.textContent='Petition submitted successfully!';
      document.getElementById('grantTitle').value='';
      document.getElementById('grantDesc').value='';
      document.getElementById('grantAmount').value='';
      setTimeout(function(){loadProfile()},1500);
    }else{
      msgEl.className='submit-msg error';
      msgEl.textContent=data.error||'Failed to submit petition.';
    }
  }catch(e){
    msgEl.className='submit-msg error';
    msgEl.textContent='Network error. Please try again.';
  }
  btn.disabled=false;
}

async function loadProfile(){
  var username=getUsername();
  if(!username){
    showError('No username specified. Use ?username=... in the URL.');
    return;
  }

  try{
    var res=await fetch('/api/members/'+encodeURIComponent(username)+'/profile');
    if(!res.ok){
      if(res.status===404) showError('Member "'+username+'" not found.');
      else showError('Failed to load profile (HTTP '+res.status+').');
      return;
    }
    var data=await res.json();
    if(!data.success){
      showError(data.error||'Failed to load profile.');
      return;
    }

    profileData=data;
    var member=data.member;
    var pub=data.publicData||{};
    var isOwnProfile=!!data.isOwnProfile;
    var isAgent=!!member.isAgent;
    var isFoundationProfile=isFoundation(member.username);
    var agentInfo=findAgentByUsername(member.username);

    if(agentInfo){
      isAgent=true;
      member.icon=member.icon||agentInfo.icon;
      member.specialty=member.specialty||agentInfo.specialty;
    }

    buildIdentity(member,pub,isAgent,agentInfo,isFoundationProfile);
    buildTabs(isAgent,isOwnProfile,isFoundationProfile);
    buildActivity(pub.recentTransactions||[]);
    buildAssets(pub.createdArtifacts||[],pub.purchasedArtifacts||[]);
    if(isAgent) buildGrants(pub.grantPetitions||[],isOwnProfile,member.username);
    if(isOwnProfile) buildSettings();
    if(isFoundationProfile) buildFoundation(pub);
    buildNavLinks(isAgent,agentInfo);

    showProfile();
  }catch(e){
    console.error('Profile load error:',e);
    showError('Failed to connect to server. Please try again later.');
  }
}

loadProfile();
</script>
</body>
</html>
